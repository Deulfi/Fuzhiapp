# Public firmware for an ESP32-C3 Super Mini as a BLE bridge to a Wuzhi ZK-502MT amp.
# No secrets: Wi-Fi is set up while flashing (web.esphome.io) or through the
# "Wuzhi Amp Bridge Setup" hotspot, and Home Assistant sets the encryption key when it adopts
# the device. The amp is found automatically. See README.md.
#
# Lean variant: Home Assistant only, no web page. wuzhi-amp-web.yaml adds the web page.

substitutions:
  name: wuzhi-amp-bridge
  friendly_name: Wuzhi Amp Bridge

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Each board gets its own name (wuzhi-amp-a1b2c3), so several can coexist.
  name_add_mac_suffix: true
  project:
    name: deulfi.wuzhi-amp-bridge
    version: "0.1.0"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/Deulfi/Fuzhiapp
      ref: esphome-bridge
      path: components
    components: [wuzhi_amp]

# Lets "Take control" in the ESPHome Device Builder turn this into an editable config.
dashboard_import:
  package_import_url: github://Deulfi/Fuzhiapp/firmware/wuzhi-amp-lean.yaml@esphome-bridge
  import_full_config: false

logger:
  level: INFO

api:
  # No key here: Home Assistant provisions one when it adopts the device.
  encryption: {}

ota:
  # No encryption block: with a runtime-provisioned api key ESPHome uses that key for OTA
  # once Home Assistant has set it, and an explicit block would need a fixed key here.
  - platform: esphome

wifi:
  ap:
    ssid: "Wuzhi Amp Bridge Setup"

captive_portal:

improv_serial:

esp32_ble_tracker:
  scan_parameters:
    active: true

ble_client:
  # 00:00:00:00:00:00 = adopt the first amp named "wuzhi..." and remember it.
  - mac_address: "00:00:00:00:00:00"
    id: amp_ble

wuzhi_amp:
  ble_client_id: amp_ble

number:
  - platform: wuzhi_amp
    gain:
      name: Gain
      max_gain: 40
    beep_volume:
      name: Beep volume
    eq_31:
      name: EQ 31 Hz
    eq_63:
      name: EQ 63 Hz
    eq_125:
      name: EQ 125 Hz
    eq_250:
      name: EQ 250 Hz
    eq_500:
      name: EQ 500 Hz
    eq_1k:
      name: EQ 1 kHz
    eq_2k:
      name: EQ 2 kHz
    eq_4k:
      name: EQ 4 kHz
    eq_8k:
      name: EQ 8 kHz
    eq_16k:
      name: EQ 16 kHz

select:
  - platform: wuzhi_amp
    source:
      name: Source
    eq:
      name: EQ

binary_sensor:
  - platform: wuzhi_amp
    aux_cable:
      name: AUX cable
    bluetooth_audio:
      name: Bluetooth audio
    connected:
      name: Amp connected

switch:
  - platform: wuzhi_amp
    aux_priority:
      name: AUX priority
    beep:
      name: Beep

button:
  - platform: wuzhi_amp
    forget_amp:
      name: Forget amp
    disconnect_phone:
      name: Disconnect phone audio

text_sensor:
  - platform: wuzhi_amp
    firmware_version:
      name: Amp firmware
    protocol_version:
      name: Amp protocol
