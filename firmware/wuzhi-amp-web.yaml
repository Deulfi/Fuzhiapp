# Public firmware, web variant: everything in wuzhi-amp-lean.yaml plus a control page
# on the board itself (http://wuzhi-amp-bridge-xxxxxx.local), usable without Home Assistant.
# Uses more RAM than the lean variant.

packages:
  base: github://Deulfi/Fuzhiapp/firmware/wuzhi-amp-lean.yaml@esphome-bridge

esphome:
  project:
    name: deulfi.wuzhi-amp-bridge-web
    version: "0.1.0"

dashboard_import:
  package_import_url: github://Deulfi/Fuzhiapp/firmware/wuzhi-amp-web.yaml@esphome-bridge
  import_full_config: false

web_server:
  port: 80
  version: 3
