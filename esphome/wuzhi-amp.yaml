# ESPHome config for an ESP32-C3 Super Mini as a BLE bridge to a Wuzhi ZK-502MT amp.
# See esphome/README.md for the flashing guide.
#
# Put these in secrets.yaml next to this file (never commit it):
#   wifi_ssid: "..."
#   wifi_password: "..."
#   api_key: "..."          # 32-byte base64, see README

esphome:
  name: wuzhi-amp
  friendly_name: Wuzhi Amp Bridge

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  # Local checkout. To build from GitHub instead, use:
  #   - source:
  #       type: git
  #       url: https://github.com/Deulfi/Fuzhiapp
  #       ref: main
  #       path: esphome/components
  #     components: [wuzhi_amp]
  - source:
      type: local
      path: components
    components: [wuzhi_amp]

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    # Uses the api encryption key; no separate OTA password.
    encryption: {}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Wuzhi Amp Fallback"

captive_portal:

esp32_ble_tracker:
  scan_parameters:
    active: true

ble_client:
  # 00:00:00:00:00:00 = find the amp automatically: the first device whose BLE name
  # starts with name_prefix is adopted and stored. Put a real address here to pin one amp.
  - mac_address: "00:00:00:00:00:00"
    id: amp_ble

wuzhi_amp:
  ble_client_id: amp_ble
  # Read-only GetTargetInfo after auth (default true).
  query_target_info: true
  # Log the amp's Bluetooth address and ID string unredacted (default false).
  log_private: false
  # Name prefix for finding the amp (any case, default "wuzhi").
  name_prefix: wuzhi
  # Wait between enabling notifications and sending the auth challenge (default 1s).
  auth_delay: 1s
  # BLE pairing (encryption) before auth (default false). The ZK-502MT works without it.
  pair: false

number:
  - platform: wuzhi_amp
    gain:
      name: Gain
      # Highest value the bridge will ever send (0-40, default 40). The ZK-502MT uses
      # 0-30 and ignores 31-40.
      max_gain: 40
    beep_volume:
      name: Beep volume
    eq_31:
      name: EQ 31 Hz
    eq_63:
      name: EQ 63 Hz
    eq_125:
      name: EQ 125 Hz
    eq_250:
      name: EQ 250 Hz
    eq_500:
      name: EQ 500 Hz
    eq_1k:
      name: EQ 1 kHz
    eq_2k:
      name: EQ 2 kHz
    eq_4k:
      name: EQ 4 kHz
    eq_8k:
      name: EQ 8 kHz
    eq_16k:
      name: EQ 16 kHz

select:
  - platform: wuzhi_amp
    source:
      name: Source
    eq:
      name: EQ

binary_sensor:
  - platform: wuzhi_amp
    aux_cable:
      name: AUX cable
    bluetooth_audio:
      name: Bluetooth audio
    connected:
      name: Amp connected

switch:
  - platform: wuzhi_amp
    aux_priority:
      name: AUX priority
    beep:
      name: Beep

button:
  - platform: wuzhi_amp
    forget_amp:
      name: Forget amp
    disconnect_phone:
      name: Disconnect phone audio

text_sensor:
  - platform: wuzhi_amp
    firmware_version:
      name: Amp firmware
    protocol_version:
      name: Amp protocol
