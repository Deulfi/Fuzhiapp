# ESPHome config for an ESP32-C3 Super Mini as a BLE bridge to a Wuzhi ZK-502MT amp.
# See esphome/README.md for the flashing guide.
#
# Put these in secrets.yaml next to this file (never commit it):
#   wifi_ssid: "..."
#   wifi_password: "..."
#   api_key: "..."          # 32-byte base64, see README
#   ota_password: "..."
#   amp_mac: "AA:BB:CC:DD:EE:FF"

esphome:
  name: wuzhi-amp
  friendly_name: Wuzhi Amp

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  # Local checkout. To build from GitHub instead, use:
  #   - source:
  #       type: git
  #       url: https://github.com/Deulfi/Fuzhiapp
  #       ref: main
  #       path: esphome/components
  #     components: [wuzhi_amp]
  - source:
      type: local
      path: components
    components: [wuzhi_amp]

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Wuzhi Amp Fallback"

captive_portal:

esp32_ble_tracker:
  scan_parameters:
    active: true
  # Finding the amp's address: while the amp is not connected to anything, this
  # logs every device whose name starts with "Wuzhi". Copy the address into
  # secrets.yaml as amp_mac. Safe to remove afterwards.
  on_ble_advertise:
    - then:
        - lambda: |-
            if (x.get_name().rfind("Wuzhi", 0) == 0 || x.get_name().rfind("wuzhi", 0) == 0) {
              ESP_LOGI("find_amp", "Found %s, address %s, RSSI %d",
                       x.get_name().c_str(), x.address_str().c_str(), x.get_rssi());
            }

ble_client:
  - mac_address: !secret amp_mac
    id: amp_ble

wuzhi_amp:
  ble_client_id: amp_ble
  # Read-only GetTargetInfo after auth (default true).
  query_target_info: true
  # Log the amp's Bluetooth address and ID string unredacted (default false).
  log_private: false
