# ESPHome config for an ESP32-C3 Super Mini as a BLE bridge to a Wuzhi ZK-502MT amp.
# See esphome/README.md for the flashing guide.
#
# Put these in secrets.yaml next to this file (never commit it):
#   wifi_ssid: "..."
#   wifi_password: "..."
#   api_key: "..."          # 32-byte base64, see README
#   amp_mac: "AA:BB:CC:DD:EE:FF"

esphome:
  name: wuzhi-amp
  friendly_name: Wuzhi Amp

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

external_components:
  # Local checkout. To build from GitHub instead, use:
  #   - source:
  #       type: git
  #       url: https://github.com/Deulfi/Fuzhiapp
  #       ref: main
  #       path: esphome/components
  #     components: [wuzhi_amp]
  - source:
      type: local
      path: components
    components: [wuzhi_amp]

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    # Uses the api encryption key; no separate OTA password.
    encryption: {}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Wuzhi Amp Fallback"

captive_portal:

esp32_ble_tracker:
  scan_parameters:
    active: true
  # Finding the amp's address: while the amp is not connected to anything, this
  # logs every device whose name starts with "Wuzhi". Copy the address into
  # secrets.yaml as amp_mac. Safe to remove afterwards.
  on_ble_advertise:
    - then:
        - lambda: |-
            const char *name = x.get_name().c_str();
            if (strncmp(name, "Wuzhi", 5) == 0 || strncmp(name, "wuzhi", 5) == 0) {
              uint64_t a = x.address_uint64();
              ESP_LOGI("find_amp", "Found %s, address %02X:%02X:%02X:%02X:%02X:%02X, RSSI %d", name,
                       (unsigned) (a >> 40) & 0xff, (unsigned) (a >> 32) & 0xff, (unsigned) (a >> 24) & 0xff,
                       (unsigned) (a >> 16) & 0xff, (unsigned) (a >> 8) & 0xff, (unsigned) a & 0xff,
                       x.get_rssi());
            }

ble_client:
  - mac_address: !secret amp_mac
    id: amp_ble

wuzhi_amp:
  ble_client_id: amp_ble
  # Read-only GetTargetInfo after auth (default true).
  query_target_info: true
  # Log the amp's Bluetooth address and ID string unredacted (default false).
  log_private: false
  # Wait between enabling notifications and sending the auth challenge (default 1s).
  auth_delay: 1s
  # BLE pairing (encryption) before auth (default false). The ZK-502MT works without it.
  pair: false

number:
  - platform: wuzhi_amp
    gain:
      name: Gain
      # Highest value the bridge will ever send (0-40, default 40). The ZK-502MT uses
      # 0-30 and ignores 31-40.
      max_gain: 40

select:
  - platform: wuzhi_amp
    source:
      name: Source

binary_sensor:
  - platform: wuzhi_amp
    aux_cable:
      name: AUX cable
    bluetooth_audio:
      name: Bluetooth audio
    connected:
      name: Amp connected
